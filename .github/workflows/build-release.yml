name: 'Build & Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.5)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION"

      - name: Sync assembly version with release version
        run: |
          # Ensure the DLL assembly version matches the release version so the
          # manifest version and assembly version never drift. Jellyfin compares
          # the assembly version against the manifest version when
          # uninstalling/updating; a mismatch breaks those flows.
          VERSION="${{ steps.version.outputs.version }}"
          # Normalize to 4-part version (1.0.5 -> 1.0.5.0) for .NET assembly attributes
          if [[ "$VERSION" != *.*.*.* ]]; then
            VERSION="${VERSION}.0"
          fi
          sed -i "s|<Version>[^<]*</Version>|<Version>${VERSION}</Version>|" Directory.Build.props
          sed -i "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>${VERSION}</AssemblyVersion>|" Directory.Build.props
          sed -i "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>${VERSION}</FileVersion>|" Directory.Build.props
          echo "Synced assembly version to ${VERSION}"
          cat Directory.Build.props

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build plugin
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-restore

      - name: Publish plugin
        run: dotnet publish --configuration Release --no-restore --output=artifacts Jellyfin.Plugin.LeavingSoon/Jellyfin.Plugin.LeavingSoon.csproj

      - name: Package release
        run: |
          cd artifacts
          zip -r "../Jellyfin.Plugin.LeavingSoon-${{ env.RELEASE_VERSION }}.zip" Jellyfin.Plugin.LeavingSoon.dll
          cd ..
          md5sum "Jellyfin.Plugin.LeavingSoon-${{ env.RELEASE_VERSION }}.zip" > "Jellyfin.Plugin.LeavingSoon-${{ env.RELEASE_VERSION }}.zip.md5"

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          {
            echo "## What's Changed"
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s" "$PREV_TAG"..HEAD | grep -v -E '^- (chore|ci|docs|Merge)' || true
            else
              git log --pretty=format:"- %s" | grep -v -E '^- (chore|ci|docs|Merge)' || true
            fi
          } > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "**Full Changelog:** https://github.com/ramonskie/jellyfin-plugin-leaving-soon/compare/$PREV_TAG...${{ github.ref_name }}" >> /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Update plugin manifest
        env:
          RELEASE_TAG: "${{ github.ref_name }}"
        run: |
          CHECKSUM=$(cut -d' ' -f1 "Jellyfin.Plugin.LeavingSoon-${{ env.RELEASE_VERSION }}.zip.md5")
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$RELEASE_VERSION" "$CHECKSUM" "$TS" "$RELEASE_TAG" <<'EOF'
          import json, sys
          version, checksum, ts, tag = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          manifest_version = version + ".0"
          with open('manifest.json') as f:
              manifest = json.load(f)
          with open('/tmp/release-notes.md') as f:
              notes = f.read().strip()
          entry = manifest[0]
          source_url = f"https://github.com/ramonskie/jellyfin-plugin-leaving-soon/releases/download/{tag}/Jellyfin.Plugin.LeavingSoon-{version}.zip"
          changelog = f"Version {version}\n{notes}"
          entry["versions"] = [v for v in entry["versions"] if v["version"] != manifest_version]
          entry["versions"].append({
              "version": manifest_version,
              "changelog": changelog,
              "targetAbi": "10.11.0.0",
              "sourceUrl": source_url,
              "checksum": checksum,
              "timestamp": ts,
          })
          # Jellyfin expects the newest version first, sorted numerically
          # (lexicographic would misorder e.g. 1.0.10 vs 1.0.2).
          def _ver_key(v):
              import re
              return [int(x) for x in re.findall(r'\d+', v["version"])]
          entry["versions"].sort(key=_ver_key, reverse=True)
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=4)
              f.write("\n")
          EOF
          echo "manifest updated for $RELEASE_VERSION"

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest already up to date; nothing to commit"
          else
            git commit -m "chore: add plugin manifest entry for v$RELEASE_VERSION"
            # Tag-triggered runs check out a detached HEAD at the tag; land the
            # manifest update on main instead. Discard the build-time version
            # edit to Directory.Build.props first so the rebase has a clean tree.
            git fetch origin main
            git checkout -- Directory.Build.props
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          update_existing_release: true
          files: |
            Jellyfin.Plugin.LeavingSoon-*.zip
            Jellyfin.Plugin.LeavingSoon-*.zip.md5
